apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-support-backend
  labels:
    app: customer-support-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customer-support-backend
  template:
    metadata:
      labels:
        app: customer-support-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/snehapullagura/customer-support-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: customer-support-backend
  ports:
    - port: 8000
      targetPort: 8000
