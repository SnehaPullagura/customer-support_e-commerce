version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Relational Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: resolutions-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: customer_support_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis Cache & PubSub Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: resolutions-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Backend FastAPI Core Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: resolutions-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@postgres:5432/customer_support_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # Frontend Next.js Web Portal & Cockpit
  # -------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: resolutions-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

  # -------------------------------------------------------------
  # Prometheus Telemetry Collector
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: resolutions-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
  redis_data:
